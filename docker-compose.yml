services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: ${DB_HOST:?set DB_HOST in the root .env file}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-fleet_tracking_live}
      DB_USER: ${DB_USER:?set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the root .env file}
      DB_SSL: "true"
      DB_SSL_CA: /run/fleettrack/rds-global-bundle.pem
      DEMO_MODE: ${DEMO_MODE:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in a .env file next to this compose file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in a .env file next to this compose file}
      CLIENT_URL: http://localhost:3000
    volumes:
      - type: bind
        source: ${DB_SSL_CA_PATH:-./server/certs/rds-global-bundle.pem}
        target: /run/fleettrack/rds-global-bundle.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
