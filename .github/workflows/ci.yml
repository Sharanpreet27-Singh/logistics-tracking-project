name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: fleettrack_test
          MYSQL_USER: fleet_test
          MYSQL_PASSWORD: fleettrack-test-password-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --protocol=tcp" --health-interval=5s --health-timeout=4s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd server && npm ci && npm run db:init && npm test
        env:
          NODE_ENV: test
          MYSQL_INTEGRATION_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: fleettrack_test
          DB_USER: fleet_test
          DB_PASSWORD: fleettrack-test-password-only
          DB_SSL: 'false'
      - run: cd client && npm install && npm run build
