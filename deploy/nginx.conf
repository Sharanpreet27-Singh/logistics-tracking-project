# Nginx site for FleetTrack on EC2: everything goes to the Node API on port 5000,
# which also serves the built client. Installed by deploy/ec2-setup.sh at
# /etc/nginx/sites-available/fleettrack. For HTTPS run certbot once a domain points here:
#   sudo apt-get install -y certbot python3-certbot-nginx && sudo certbot --nginx -d your-domain.com
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Socket.IO (WebSocket upgrade)
  location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # API + client
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
